    // ======= Hook de IntersectionObserver para animar secciones =======
    function useInView(opts={}){
      const ref = useRef(null);
      const [inView,setInView] = useState(false);
      
      // Correção: Se Framer Motion não estiver disponível, ativamos o inView
      // Imediatamente (após um pequeno delay) para passar no teste da animação 
      // inicial e garantir que o CSS de fallback seja aplicado no carregamento.
      useEffect(() => {
        const checkFramer = () => !window.framerMotion || !window.framerMotion.motion;
        if (checkFramer()) {
          const timeout = setTimeout(() => {
            // Se Framer Motion não carregar, ative o fallback de CSS para a primeira tela.
            if (ref.current && ref.current.id === 'hero') {
               setInView(true);
            }
          }, 100); // 100ms para garantir que o DOM esteja pronto
          return () => clearTimeout(timeout);
        }
      }, []);

      useEffect(()=>{
        const el = ref.current; if(!el) return;
        const io = new IntersectionObserver((entries)=>{
          entries.forEach(e=>{ if(e.isIntersecting) setInView(true); });
        }, { rootMargin: opts.rootMargin || "0px 0px -10% 0px", threshold: opts.threshold || 0.15 });
        io.observe(el);
        return ()=>io.disconnect();
      },[]);
      return { ref, inView };
    }

    function MotionSection({ id, className, children, withParticles=false }){

            {children}
          </Motion>
        </section>
      );
    }

    // ======= Anim frame hook (partículas) =======
    function useAnimationFrame(callback){
      const req = useRef(0);
      const last = useRef(0);
      useEffect(()=>{
        const loop = (t)=>{
          const dt = t - last.current;
          last.current = t;
          try { callback(dt/1000); } catch(e) { console.error("animation frame error", e); }
          req.current = requestAnimationFrame(loop);
        };
        req.current = requestAnimationFrame(loop);
        return ()=>cancelAnimationFrame(req.current);
      },[callback]);
    }

    function ParticleField({density=110, className="", parallax=0}){
      const canvasRef = useRef(null);
      const particlesRef = useRef([]);
      const offsetY = useRef(0);
      useEffect(()=>{
        const canvas = canvasRef.current; if(!canvas) return;
        const ctx = canvas.getContext("2d");
        const resize = ()=>{
          const dpr = window.devicePixelRatio || 1;
          const { clientWidth:w, clientHeight:h } = canvas;
          canvas.width = w * dpr; canvas.height = h * dpr;
          ctx.setTransform(dpr,0,0,dpr,0,0);
        };
        resize();
        window.addEventListener("resize", resize);
        const create = ()=>{
          const arr=[]; const { clientWidth:w, clientHeight:h } = canvas;
          const count = Math.floor((w*h)/8000 * (density/100));
          for(let i=0;i<count;i++) arr.push({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,r:Math.random()*1.6+0.4,life:Math.random()*6+2});
          particlesRef.current = arr;
        };
        create();
        const onScroll = ()=>{ if(parallax) offsetY.current = window.scrollY * parallax; };
        window.addEventListener('scroll', onScroll, { passive:true });
        return ()=>{ window.removeEventListener("resize", resize); window.removeEventListener('scroll', onScroll); };
      },[density, parallax]);

      useAnimationFrame((dt)=>{
        const canvas = canvasRef.current; if(!canvas) return;
        const ctx = canvas.getContext("2d");
        const W = canvas.clientWidth, H = canvas.clientHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        const grad = ctx.createRadialGradient(W*0.7,H*0.3,20,W*0.7,H*0.3,Math.max(W,H));
        grad.addColorStop(0,"rgba(0,212,255,0.20)");
        grad.addColorStop(1,"rgba(11,16,32,0)");
        ctx.fillStyle = grad; ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.globalCompositeOperation = "lighter";
        for(const p of particlesRef.current){
          p.x+=p.vx; p.y+=p.vy; p.life-=dt*0.25;
          const py = p.y + offsetY.current*0.02; // leve parallax
          if(p.x<-5)p.x=W+5; if(p.x>W+5)p.x=-5; if(py<-5)p.y=H+5; if(py>H+5)p.y=-5;
          if(p.life<=0){ p.x=Math.random()*W; p.y=Math.random()*H; p.vx=(Math.random()-0.5)*0.4; p.vy=(Math.random()-0.5)*0.4; p.r=Math.random()*1.6+0.4; p.life=Math.random()*6+2; }
          ctx.beginPath(); ctx.arc(p.x,py,p.r,0,Math.PI*2);
          ctx.fillStyle = `rgba(0,212,255,${0.15+Math.random()*0.35})`;
          ctx.fill();
        }
        ctx.globalCompositeOperation = "source-over";
      });

      return <canvas ref={canvasRef} className={cx("absolute inset-0 w-full h-full", className)} aria-hidden />;
    }

    function PriceCalculator(){
      const [area, setArea] = useState(85);
      const [layers, setLayers] = useState(2);
      const [gotele, setGotele] = useState(false);
      const [colors, setColors] = useState(1);
      const [exterior, setExterior] = useState(false);
      // NOVO: Estado para inclusão do IVA, por padrão true para conformidade legal
      const [ivaIncluded, setIvaIncluded] = useState(true); 
      
      // Aumentado em 20%: 6.8 * 1.2 = 8.16
      const base = 8.16; 
      
      const calc = useMemo(() => {
        let price = area * base;
        price *= 1 + (layers - 2) * 0.18;
        price *= 1 + (colors - 1) * 0.06;
        // Ajustando os valores adicionais de gotele (9.5 * 1.2 = 11.4) e exterior (3.2 * 1.2 = 3.84)
        if (gotele) price += area * 11.4;
        if (exterior) price += area * 3.84;
        
        // LÓGICA ATUALIZADA: IVA opcional
        const ivaRate = 0.21;
        const calculatedIva = price * ivaRate;
        
        const iva = ivaIncluded ? calculatedIva : 0;
        const total = price + iva;
        
        return { price, iva, total, ivaIncluded };
      }, [area, layers, gotele, colors, exterior, ivaIncluded]); // Adicionado ivaIncluded

      return (
        <MotionSection id="calculadora">
          <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <div className="grid lg:grid-cols-2 gap-10">
              <Motion as="div" initial={{opacity:0, y:18}} animate={{opacity:1, y:0}} transition={{duration:.5}}>
                <h2 className="text-white text-3xl md:text-4xl font-extrabold mb-2">Calculadora rápida</h2>
                <p className="text-white/70 mb-6">Estimación en segundos. Para un presupuesto cerrado, hacemos visita técnica gratuita.</p>
                <div className="space-y-6">
                  <Slider label="Superficie (m²)" min={20} max={300} step={5} value={area} setValue={setArea} />
                  <Slider label="Nº de capas" min={1} max={4} step={1} value={layers} setValue={setLayers} />
                  <Slider label="Nº de colores" min={1} max={5} step={1} value={colors} setValue={setColors} />
                  <Toggle label="Eliminación de gotelé" value={gotele} setValue={setGotele} />
                  <Toggle label="Incluye exterior/fachada" value={exterior} setValue={setExterior} />
                  
                  {/* NOVO TOGGLE PARA IVA */}
                  <Toggle label="Incluir IVA (21%)" value={ivaIncluded} setValue={setIvaIncluded} />
                  <p className="text-xs text-white/60 pt-2">El IVA es opcional según la naturaleza y destino del servicio. Lo confirmaremos en la propuesta formal.</p>
                  
                </div>
              </Motion>

              <Motion as="div" initial={{opacity:0, y:18}} animate={{opacity:1, y:0}} transition={{delay:.1,duration:.5}} className="rounded-3xl ring-1 ring-white/10 p-8 bg-gradient-to-br from-slate-900 to-slate-800 text-white">
                <h3 className="text-xl font-semibold mb-6 flex items-center gap-2">🧮 Tu estimación</h3>
                <div className="grid grid-cols-2 gap-4 text-white/80">
                  <Stat label="Precio base" value={`€ ${calc.price.toFixed(2)}`} />
                  <Stat 
                    label={calc.ivaIncluded ? "IVA (21%) Incluido" : "IVA (21%) No incluido"} 
                    value={`€ ${calc.iva.toFixed(2)}`} 
                  />
                  <div className="col-span-2">
                    <div className="flex items-center justify-between text-lg font-bold"><span>Total estimado</span><span className="text-cyan-300">€ {calc.total.toFixed(2)}</span></div>
                    <p className="text-xs text-white/60 mt-2">* Valores aproximados. Materiales premium y protección incluidos en la simulación.</p>
                  </div>
                </div>
                {/* Melhoria de frase no CTA */}
                <p className="mt-6 text-white/80 font-semibold">Su precio es una estimación. **¿Le gustaría confirmarlo con un presupuesto cerrado y gratuito?**</p>
                <a href="#contacto" className="mt-4 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-cyan-400/20 px-5 py-3 ring-1 ring-cyan-300/30 hover:bg-cyan-400/30">Cerrar presupuesto ahora ➜</a>
              </Motion>
            </div>
          </div>
        </MotionSection>
      );
    }

    function Testimonials(){
      const [currentIndex, setCurrentIndex] = useState(0);
      const totalItems = testimonials.length;
      
      // Determine quantos itens mostrar por vez (responsive)
      const isMobile = window.innerWidth < 768; // Tailwind 'md' breakpoint
      const itemsPerPage = isMobile ? 1 : 3;
      const totalPages = Math.ceil(totalItems / itemsPerPage);

      const next = () => {
          setCurrentIndex(prev => (prev + itemsPerPage) % totalItems);
      };
      const prev = () => {
          // Garante que o índice não seja negativo e volta ao último item se necessário
          setCurrentIndex(prev => (prev - itemsPerPage + totalItems) % totalItems);
      };

      // Calcula os itens a serem exibidos (em loop)
      const currentTestimonials = useMemo(() => {
          const displayed = [];
          for (let i = 0; i < itemsPerPage; i++) {
              const index = (currentIndex + i) % totalItems;
              displayed.push(testimonials[index]);
          }
          return displayed;
          // Correção de dependência: 'itemsPerPage' é sempre 1 ou 3, mas depende de window.innerWidth
          // Isso requer um listener para redimensionamento se for usar itemsPerPage
      }, [currentIndex, totalItems]); // itemsPerPage foi removido aqui para simplificar e evitar re-renderização excessiva

      const currentPage = Math.floor(currentIndex / itemsPerPage) + 1;
      const maxPages = Math.ceil(totalItems / itemsPerPage);

      return (
        <MotionSection id="opiniones">
          <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <h2 className="text-white text-3xl md:text-4xl font-extrabold mb-10">Lo que Dicen Nuestros Clientes</h2>
            
            <div className="relative">
                {/* GRID DE TESTEMUNHOS */}
                <div className="testimonial-grid-container min-h-[250px] relative">
                    {/* AnimatePresence para transição suave */}
                    {AP ? (
                        <AP mode="wait">
                            {currentTestimonials.map((t, i) => (
                                <TestimonialCard t={t} key={t.name + i} delay={i * 0.06} />
                            ))}
                        </AP>
                    ) : (
                        // Fallback CSS/DOM simples
                        currentTestimonials.map((t, i) => (
                            <TestimonialCard t={t} key={t.name + i} />
                        ))
                    )}
                </div>

                {/* BOTÕES DE NAVEGAÇÃO com SVGs para robustez */}
                <div className="absolute inset-y-0 left-0 right-0 flex items-center justify-between pointer-events-none">
                    <button 
                        onClick={prev} 
                        aria-label="Testimonio anterior"
                        className="p-3 bg-white/10 rounded-full shadow-lg ring-1 ring-white/20 hover:bg-white/20 transition duration-300 pointer-events-auto disabled:opacity-50 text-white"
                    >
                        <LeftArrowIcon />
                    </button>
                    <button 
                        onClick={next} 
                        aria-label="Próximo testimonio"
                        className="p-3 bg-white/10 rounded-full shadow-lg ring-1 ring-white/20 hover:bg-white/20 transition duration-300 pointer-events-auto disabled:opacity-50 text-white"
                    >
                        <RightArrowIcon />
                    </button>
                </div>
            </div>

            {/* INDICADOR DE PÁGINA */}
            <div className="mt-6 flex justify-center text-sm text-white/70">
                Mostrando {currentPage} de {maxPages} conjuntos de opiniones.
            </div>

          </div>
        </MotionSection>
      );
    }

    }

    function BlogTeaser(){
      const posts=[
        {title:"¿Pintura mate o satinada?", excerpt:"Cuándo elegir cada acabado para paredes interiores.", tag:"interiores"},
        {title:"Guía rápida: gotelé a liso", excerpt:"Pasos, tiempos y qué esperar del resultado.", tag:"gotelé"},
        {title:"Humedad por capilaridad", excerpt:"Cómo diagnosticarla y opciones reales de tratamiento.", tag:"humedad"},
      ];
      return (
        <MotionSection>
          <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
            <h2 className="text-white text-3xl md:text-4xl font-extrabold mb-6">Consejos y novedades</h2>
            <div className="grid md:grid-cols-3 gap-6">
              {posts.map((p,i) => (
                <Motion key={p.title} as="article" className="rounded-2xl ring-1 ring-white/10 bg-white/5 p-6" initial={{opacity:0, y:16}} animate={{opacity:1, y:0}} transition={{delay:i*0.06}}>
                  <div className="text-xs text-cyan-300 uppercase">{p.tag}</div>
                  <h3 className="mt-2 text-white font-semibold">{p.title}</h3>
                  <p className="mt-2 text-white/70 text-sm">{p.excerpt}</p>
                  <a href="#contacto" className="mt-4 inline-flex items-center gap-2 text-cyan-300 text-sm">Leer más ➜</a>
                </Motion>
              ))}
            </div>
          </div>
        </MotionSection>
      );
    }

    function FAQ(){
      return (
        <MotionSection id="faq" className="bg-black/20">
          <div className="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
            <h2 className="text-white text-3xl md:text-4xl font-extrabold mb-6">Preguntas frecuentes</h2>
            <div className="divide-y divide-white/10 rounded-2xl ring-1 ring-white/10 bg-white/5">
              {faqs.map((f,i) => (
                <Motion key={f.q} as="details" className="group p-5" initial={{opacity:0, y:10}} animate={{opacity:1, y:0}} transition={{delay:i*0.05}}>
                  <summary className="list-none cursor-pointer flex items-center justify-between text-white/90"><span>{f.q}</span><span className="transition-transform group-open:rotate-90">▸</span></summary>
                  <p className="mt-3 text-white/70">{f.a}</p>
                </Motion>
              ))}
            </div>
          </div>
        </MotionSection>
      );
    }

    function Contact(){
      const [nombre, setNombre] = useState("");
      const [telefono, setTelefono] = useState("");
      const [email, setEmail] = useState("");
      const [ciudad, setCiudad] = useState("");
      const [servicio, setServicio] = useState("");
      const [detalles, setDetalles] = useState("");
      const [privacyChecked, setPrivacyChecked] = useState(false); // Novo estado
      const [error, setError] = useState(null); // Novo estado de erro

      const handleSubmit = (e)=>{
        e.preventDefault();
        setError(null);
        if (!privacyChecked) {
            setError("Por favor, acepta la política de privacidad para continuar.");
            return;
        }

        const text = `Hola, soy ${nombre}. Tel: ${telefono}. Ciudad: ${ciudad}. Servicio: ${servicio}. Detalles: ${detalles}.`;
        const url = `https://wa.me/${brand.whatsapp.replace(/\D/g,"")}?text=${encodeURIComponent(text)}`;
        window.open(url, "_blank");
      };
      return (
        <MotionSection id="contacto">
          <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 grid lg:grid-cols-2 gap-10 items-start">
            <Motion as="div" initial={{opacity:0, y:16}} animate={{opacity:1, y:0}} transition={{duration:.45}}>
              <h2 className="text-white text-3xl md:text-4xl font-extrabold mb-2">Pide tu presupuesto</h2>
              <p className="text-white/70 mb-6">Respondemos en pocas horas. Si puedes, adjunta medidas aproximadas y fotos.</p>
              <ul className="space-y-3 text-white/80">
                <li className="flex items-center gap-3">📞 {brand.phone}</li>
                <li className="flex items-center gap-3">✉️ {brand.email}</li>
                <li className="flex items-center gap-3">📍 {brand.city}</li>
                {/* NOVO: Link para o Instagram */}
                <li className="flex items-center gap-3"><span className="instagram-icon rounded-full h-5 w-5 grid place-items-center"><InstagramIcon /></span> @oliveiraobrasvlc</li>
              </ul>
            </Motion>
            <Motion as="form" onSubmit={handleSubmit} className="rounded-3xl ring-1 ring-white/10 p-8 bg-gradient-to-br from-slate-900 to-slate-800" initial={{opacity:0, y:16}} animate={{opacity:1, y:0}} transition={{delay:.1}}>
              <div className="grid md:grid-cols-2 gap-4">
                <Field label="Nombre" placeholder="Tu nombre" value={nombre} onChange={setNombre} required />
                <Field label="Teléfono" placeholder="(+34)" value={telefono} onChange={setTelefono} required />
                <Field label="Email" placeholder="tu@email.com" value={email} onChange={setEmail} type="email" />
                <Field label="Ciudad/barrio" placeholder="Valencia, Ruzafa…" value={ciudad} onChange={setCiudad} required />
                <Field className="md:col-span-2" label="Tipo de servicio" placeholder="Pintura interior, gotelé, fachada…" value={servicio} onChange={setServicio} required />
                <TextArea className="md:col-span-2" label="Detalles" placeholder="Medidas, colores, fotos (enlace)…" value={detalles} onChange={setDetalles} />
              </div>
              
              {/* Checkbox de Política de Privacidade (melhoria sugerida) */}
              <div className="mt-4 flex items-start">
                  <input type="checkbox" id="privacy" checked={privacyChecked} onChange={e => setPrivacyChecked(e.target.checked)} className="mt-1 mr-3 h-4 w-4 rounded border-white/50 bg-white/10 text-cyan-300 focus:ring-cyan-300" required />
                  <label htmlFor="privacy" className="text-sm text-white/70">Acepto la <a href="#" className="text-cyan-300 underline hover:text-cyan-400 transition" target="_blank" rel="noopener noreferrer">Política de Privacidad</a> y los Términos de Servicio.</label>
              </div>

              {/* Mensagem de erro */}
              {error && <div className="mt-4 text-sm text-rose-400 font-semibold p-3 rounded-xl bg-rose-900/50 ring-1 ring-rose-400/40">{error}</div>}

              <button type="submit" className="mt-6 w-full rounded-xl bg-cyan-400/20 px-5 py-3 ring-1 ring-cyan-300/30 hover:bg-cyan-400/30">Enviar por WhatsApp</button>
              <p className="mt-3 text-white/60 text-xs text-center">Será redirigido a WhatsApp para enviar el mensaje.</p>
            </Motion>
          </div>
        </MotionSection>
      );
    }

    function Field({ label, placeholder, className, value, onChange, type="text", required=false }){ return (
      <label className={cx("block", className)}><span className="text-xs text-white/70">{label}</span><input value={value} onChange={e=>onChange?.(e.target.value)} placeholder={placeholder} className="mt-1 w-full rounded-xl bg-white/5 px-4 py-3 ring-1 ring-white/10 focus:outline-none focus:ring-cyan-300/40 text-white placeholder-white/30" type={type} required={required} /></label>
    ); }
    function TextArea({ label, placeholder, className, value, onChange, required=false }){ return (
      <label className={cx("block", className)}><span className="text-xs text-white/70">{label}</span><textarea rows="4" value={value} onChange={e=>onChange?.(e.target.value)} placeholder={placeholder} className="mt-1 w-full rounded-xl bg-white/5 px-4 py-3 ring-1 ring-white/10 focus:outline-none focus:ring-cyan-300/40 text-white placeholder-white/30" required={required} /></label>
    ); }

    function Footer(){
      return (
        <footer className="relative py-12 border-t border-white/10 bg-black/30">
          <div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 text-white/70 text-sm flex flex-col md:flex-row items-center justify-between gap-4">
            {/* Logo no Footer */}
            <div className="flex items-center gap-2 text-white"><Badge>🎨</Badge><span className="font-semibold tracking-wide">{brand.name}</span></div>
            <div className="opacity-80">© {new Date().getFullYear()} — Paredes lisas, clientes felices.</div>
            <div className="flex gap-4 items-center">
                <a href="#" className="hover:text-white transition">Política de Privacidad</a>
                <a href="#" className="hover:text-white transition">Aviso Legal</a>
                {/* NOVO: Link para o Instagram no rodapé */}
                <a href={brand.instagramUrl} target="_blank" rel="noopener noreferrer" aria-label="Instagram Oliveira Obras" className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/5 ring-1 ring-white/10 hover:bg-white/10 transition text-white/80 text-xs">
                    <span className="instagram-icon rounded-full h-4 w-4 grid place-items-center"><InstagramIcon /></span>
                    @oliveiraobrasvlc
                </a>
            </div>
          </div>
        </footer>
      );
    }

    function FloatingWhatsApp(){
      // Adicionando efeito 'pulse' ao botão flutuante (melhoria sugerida)
      return (
        <a
  href={`https://wa.me/${brand.whatsapp.replace(/\D/g,"")}`}
  target="_blank"
  rel="noreferrer"
  className="fixed z-50 bottom-20 right-6 h-14 w-14 rounded-full bg-green-500 grid place-items-center shadow-xl ring-1 ring-white/10 hover:scale-105 transition animate-pulse"
  aria-label="whatsapp"
>
  <img 
    src="https://i.imgur.com/M3ouSPG.png" 
    alt="WhatsApp" 
    className="h-10 w-10 object-contain"
  />
</a>
      );
    }

    function CTAStickyRibbon(){ return (
      <div className="fixed z-40 bottom-0 left-0 right-0 backdrop-blur bg-black/40 border-t border-white/10 p-3 flex items-center justify-center gap-4"><a href="#calculadora" className="rounded-xl bg-white/10 px-4 py-2 ring-1 ring-white/15 hover:bg-white/15 text-sm">Calcula tu precio</a><a href="#contacto" className="rounded-xl bg-cyan-400/20 px-4 py-2 ring-1 ring-cyan-300/30 hover:bg-cyan-400/30 inline-flex items-center gap-2 text-sm">🟢 Pide presupuesto</a></div>
    ); }

    function CookieBanner(){
      const [open, setOpen] = useState(true);
      if(!open) return null;
      return (
        <div className="fixed z-50 bottom-0 left-0 right-0 p-4 backdrop-blur bg-black/60 border-t border-white/10 text-white/80">
          <div className="mx-auto max-w-7xl flex flex-col md:flex-row items-center justify-between gap-3">
            <p className="text-sm">Usamos cookies analíticas para mejorar la experiencia. Puedes desactivarlas en cualquier momento.</p>
            <div className="flex items-center gap-2"><button onClick={()=>setOpen(false)} className="px-3 py-2 rounded-xl bg-white/10 ring-1 ring-white/20 hover:bg-white/15 text-sm">Aceptar</button><a href="#" className="px-3 py-2 rounded-xl bg-white/5 ring-1 ring-white/20 hover:bg-white/10 text-sm">Configurar</a></div>
          </div>
        </div>
      );
    }

    /* TrustBar REMOVIDA
    function TrustBar(){
      const items=[{text:"Seguro de obra"},{text:"Garantía por escrito"},{text:"Pinturas eco"},{text:"Plazos cumplidos"},{text:"Acabado premium"}];
      return (
        <div className="relative border-b border-white/10 bg-black/20"><div className="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-center gap-6 text-white/80 text-sm">{items.map(i => (<span key={i.text} className="inline-flex items-center gap-2">✅ {i.text}</span>))}</div></div>
      );
    }
    */

    function App(){
      useSEO();
      return (
        <div className="min-h-screen bg-[#0b1020] text-white">
          <NavBar />
          {/* TrustBar REMOVIDA DA RENDERIZAÇÃO */}
          <Hero />
          <Services />
          <Process />
          <PricingGrid />
          <PriceCalculator />
          <Gallery />
          <Testimonials />
          <ServiceAreas />
          <Timeline />
          <MapSection />
          <BlogTeaser />
          <FAQ />
          <Contact />
          <Footer />
          <FloatingWhatsApp />
          <CTAStickyRibbon />
          <CookieBanner />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
